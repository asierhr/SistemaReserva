name: CD Testing

on:
  push:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      TAG: ${{ steps.tag.outputs.TAG }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Generar tag
        id: tag 
        run: echo "TAG=v${GITHUB_SHA::7} >> $GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Build and push
        env:
          TAG: ${{ steps.tag.outputs.TAG}}
        run: npx nx affected --target=build-and-push --base=origin/main --args="--tag=$TAG"

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    enviroment: testing
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Testing
        env:
          APP_VERSION: ${{ needs.build-and-push.outputs.TAG }}
        run: |
          export APP_VERSION=$APP_VERSION
          docker compose -f docker-compose.yaml -f docker-compose-test.yaml up --force-recreate



